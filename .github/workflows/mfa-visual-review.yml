name: MFA visual review (Playwright)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install screenshot browser
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Render actual MFA components with test-only authentication fixtures
        run: node scripts/mfa-visual-screenshots.mjs
      - name: Upload eight mobile and desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mfa-security-ui-desktop-mobile
          path: artifacts/mfa-visual/*.png
          if-no-files-found: error
      # Published screenshots remain in this review branch; content-identical PNGs do not produce a new commit.
      - name: Commit review PNGs to PR branch
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p docs/review/mfa-redesign
          cp artifacts/mfa-visual/*.png docs/review/mfa-redesign/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/review/mfa-redesign/*.png
          if ! git diff --cached --quiet; then
            git commit -m 'docs(mfa): publish eight Playwright review screenshots'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
