name: Amazon confirmation safety
on:
  push:
    branches: [feature/amazon-confirmation-idempotency-20261016]
  pull_request:
    branches: [main, feature/amazon-edge-reconciliation-20261015]
jobs:
  safety:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: confirmations_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_TEST_URL: postgres://postgres:postgres@localhost:5432/confirmations_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/integration/amazon-confirmations.pg.test.mjs
      - run: node --test scripts/*.test.mjs
      - run: npm run build
