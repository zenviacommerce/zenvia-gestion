name: Build ZENVIA Gestión

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test application logic
        run: node --test $(find scripts -maxdepth 1 -name '*.test.mjs' ! -name 'mfa-real-integration.test.mjs' | sort)
      - name: Orders pool-pressure and KPI regressions
        run: npx vitest run tests/orders-pool.test.ts tests/shopify-performance-sql.test.ts
      - name: Billing checkout pause regressions
        run: npx vitest run tests/billing-checkout-pause.test.tsx tests/billing-checkout-pause-service.test.ts tests/billing-central-catalog.test.ts
      - name: Tracking release regressions
        run: npx vitest run tests/orders-tracking-projection-compatibility.test.ts tests/tracking-*.test.ts tests/shipment-tracking-*.test.ts tests/shipment-tracking-*.test.tsx tests/mrw-*.test.ts tests/mrw-*.test.tsx
      - name: Orders workbench and Summary regressions
        run: npx vitest run tests/orders-workbench*.test.ts tests/orders-workbench*.test.tsx tests/workbench-tabs.test.tsx tests/pickup-history-embedded.test.tsx tests/dashboard-order-finance*.test.tsx tests/amazon-pii-operational-list.test.tsx tests/orders-pagination-service.test.ts
      - name: External shipment regressions
        run: npx vitest run tests/external-shipment*.test.ts tests/external-shipment*.test.tsx tests/shipping-quote-isolation.test.ts
      - name: Pickup signatures, carrier batches and disabled retention regressions
        run: npx vitest run tests/pickup-*.test.ts tests/pickup-*.test.tsx tests/signature-pad.test.tsx --maxWorkers=2
      - name: Typecheck pickup Edge Functions with Deno
        run: npx --yes deno@2.9.6 check --no-lock supabase/functions/pickup-report-documents/index.ts supabase/functions/pickup-report-purge/index.ts
      - name: Build production bundle
        run: npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

