name: VERI FACTU phase 1 PostgreSQL concurrency

on:
  push:
    branches: [feature/verifactu-shadow-phase1-20261024]
    paths:
      - 'supabase/migrations/*verifactu*.sql'
      - 'tests/fixtures/verifactu-before.sql'
      - 'tests/verifactu-*.test.*'
      - 'scripts/verifactu*concurrency.mjs'
      - '.github/workflows/verifactu-phase1.yml'
  pull_request:
    paths:
      - 'supabase/migrations/*verifactu*.sql'
      - 'tests/fixtures/verifactu-before.sql'
      - 'tests/verifactu-*.test.*'
      - 'scripts/verifactu*concurrency.mjs'
      - '.github/workflows/verifactu-phase1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Run real PostgreSQL concurrency gate
        env:
          VERIFACTU_DISPOSABLE_POSTGRES: '1'
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          node scripts/verifactu-postgres-concurrency.mjs
          node scripts/verifactu-correction-postgres-concurrency.mjs

  unit-build-and-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Application script contracts
        run: node --test $(find scripts -maxdepth 1 -name "*.test.mjs" ! -name "mfa-real-integration.test.mjs" | sort)
      - name: Complete regression suite
        run: npm test -- --maxWorkers=2 --minWorkers=1
      - run: npm run build
      - name: Install pinned screenshot runner
        run: npm install --no-save --package-lock=false playwright@1.58.2 && npx playwright install --with-deps chromium
      - name: Capture synthetic before and after at desktop and mobile widths
        run: |
          node scripts/verifactu-visual-capture.mjs
          VF_CORRECTION_CAPTURE=docs/deploy/20261024-verifactu-correction npx vitest run tests/verifactu-correction-visual.test.tsx
          node scripts/verifactu-correction-visual-capture.mjs
          VF_NEXT_CAPTURE=docs/deploy/20261024-verifactu-next/visual npx vitest run tests/verifactu-monitor-visual.test.tsx
          node scripts/verifactu-next-visual-capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: verifactu-correction-circuit
          path: |
            artifacts/verifactu-correction
            docs/deploy/20261024-verifactu-correction/rectificativa-synthetic.pdf
            docs/deploy/20261024-verifactu-next/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: verifactu-phase1-before-after
          path: artifacts/verifactu-phase1-visual
