<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <script>
      (function(){
        try{
          var deviceOverride=localStorage.getItem('zenvia-gestion-theme-device-override');
          var preference=localStorage.getItem('zenvia-gestion-theme-preference');
          var resolved=localStorage.getItem('zenvia-gestion-theme');
          var theme=deviceOverride==='light'||deviceOverride==='dark'
            ?deviceOverride
            :(preference==='light'||preference==='dark'
              ?preference
              :(resolved==='light'||resolved==='dark'?resolved:'light'));
          document.documentElement.dataset.theme=theme;
          document.documentElement.style.colorScheme=theme;
        }catch(_error){}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ZENVIA Gestión" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/zenvia-app-icon-180.png?v=20261012" />
    <link rel="icon" type="image/png" sizes="180x180" href="/zenvia-app-icon-180.png?v=20261012" />
    <title>ZENVIA Gestión</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
