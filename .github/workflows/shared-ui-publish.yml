name: Package @zenvia/ui draft (manual)
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed version with existing immutable ui-vVERSION tag
        required: true
        type: string
permissions:
  contents: write
jobs:
  package-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-v${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Require tag and package version to agree
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: node -e "const p=require('./packages/ui/package.json');if(p.version!==process.env.EXPECTED_VERSION)throw Error('Version mismatch')"
      - run: node --test scripts/shared-ui-package.test.mjs
      - run: npm pack --workspace=@zenvia/ui --pack-destination /tmp
      - name: Prepare immutable artifact and draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          tarball="/tmp/zenvia-ui-${VERSION}.tgz"
          (cd /tmp && sha256sum "zenvia-ui-${VERSION}.tgz" > shared-ui.sha256)
          gh release create "ui-v${VERSION}" "$tarball" /tmp/shared-ui.sha256 --verify-tag --draft --title "@zenvia/ui ${VERSION}" --notes-file packages/ui/README.md
