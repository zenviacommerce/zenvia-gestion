name: MFA visual review (Playwright)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install screenshot browser
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Render actual MFA components with test-only authentication fixtures
        run: node scripts/mfa-visual-screenshots.mjs
      - name: Verify migrated design layouts and data parity
        run: |
          node scripts/design-phase1-screenshots.mjs before
          node scripts/design-phase1-screenshots.mjs after
      - name: Verify image previews preserve complete images
        run: |
          node scripts/image-preview-screenshots.mjs before
          node scripts/image-preview-screenshots.mjs after
      - name: Upload image preview review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-preview-review
          path: docs/deploy/hotfix-preview-review-20261020/
          if-no-files-found: error
      - name: Verify finance phase 2 layouts and interaction parity
        run: |
          node scripts/design-phase2-screenshots.mjs before
          node scripts/design-phase2-screenshots.mjs after
      - name: Upload finance phase 2 review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-phase2-review
          path: docs/deploy/design-phase2-review-20261020/
          if-no-files-found: error
      - name: Upload design review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-phase1-review
          path: docs/deploy/design-phase1-review-20261020/
          if-no-files-found: error
      - name: Upload eight mobile and desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mfa-security-ui-desktop-mobile
          path: artifacts/mfa-visual/*.png
          if-no-files-found: error

