name: Auth resilience tests
on:
  push:
    branches: [feature/auth-resilience-phase2-20261015]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  auth-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit=auth-test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-test-results
          path: auth-test-results.xml
          if-no-files-found: ignore
